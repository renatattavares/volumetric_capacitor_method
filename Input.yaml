# ============================================================
#  INPUT FILE FOR VCM-PCM SIMULATION
#  All physical, geometric and numerical parameters
# ============================================================

problem:
  type: 5               # 1 = Cylindrical, 2 = Pouch Baseline, 3 = Pouch Proposed, 4 = Module, 5 = Module with no PCM
  pouch: 1              # 1 = Double, 2 = PCM, 3 = CPCM

time:
  TotalTime: 858        # [s] 
  dt: 0.001             # [s]

mesh:
  dx: 0.001             # [m]
  dy: 0.001             # [m]

battery_geometry:
  # Cylindrical cell - Simulation Type 1
  D: 0.018              # [m] cylindrical diameter
  h: 0.065              # [m] cylindrical height
  # Pouch cell - Simulation Type 2, 3, 4 and 5
  t: 0.005          # [m] pouch thickness
  l: 0.125          # [m] pouch length
  w: 0.060          # [m] pouch width
  t_fin: 0.001          # [m] aluminum fin thickness
  t_pcm: 0.001          # [m] PCM/CPCM thickness

initial_conditions:
  Tinitial: 25          # [°C]
  Q: 200000             # [W/m³] volumetric heat dissipation

boundary_temperatures:
  Tn: 0                 # [°C] 
  Ts: 0                 # [°C]
  Te: 0                 # [°C]
  Tw: 0                 # [°C]

boundary_fluxes:
  qn: 0            
  qs: 0
  qe: 0
  qw: 0

materials:

  battery:
    rho: 2250           # [kg/m³]
    kx: 0.97            # [W/m.K]
    ky: 26.57           # [W/m.K]
    cp: 1230            # [J/kg.K]

  pcm:
    rho: 776            # [kg/m³]
    k: 0.425            # [W/m.K]
    cp: 2150            # [J/kg.K]    
    L: 247050           # [J/kg]
    Tmelt: 36.1         # [°C]

  aluminum:
    rho: 2719           # [kg/m³]
    k: 202.4            # [W/m.K]       
    cp: 871             # [J/kg.K]

  graphite:
    rho: 2235           # [kg/m³]
    kx: 6.5             # [W/kg.K] 
    ky: 1659.3          # [W/kg.K] 
    cp: 762.5           # [J/kg.K]

  copper:
    rho: 8978           # [kg/m³]
    k: 387.6            # [W/m.K]
    cp: 381             # [J/kg.K]

cpcm:
  porosity: 0.92

convection:
  cold_plate:
    h_cp: 1000          # [W/m².K]
    T_cp: 25            # [°C]
    m_dot: 0.40         # [kg/s]
    cp_liq: 3338        # Considerando 15°C

  natural:
    h_air: 2            # [W/m².K]      
    T_air: 25           # [°C]

module:
  lines: 1
  columns: 20

mission:
    variable_resistance: false
    current: [64.6, 64.6, 37.5, 28.9, 22.5, 61.9, 61.9]           # Cell current per flight phase [A]
    times: [12, 42, 126, 726, 810, 840]                           # [s]
    #times: [5, 6, 7, 8, 9, 10]                                   # [s]
    SOCinit: 95                                                   # [%]
    cell_capacity: 10000                                          # [mAh]
    charge: true                                             # If true, the battery is charged at the end of the mission
    charge_rate: 3                                                # [C-rate]
    max_charge_temp: 45                                           # [°C]
    q_dot: [426264, 426264, 143623, 85208, 51512, 391091, 391091] # Thermal load per flight phase [W/m³]
    cooling: false
    

thermal_runaway:
    active: false           
    cell: 4            # Cell in thermal runaway   
    time: 5            # [s]
    duration: 300      # [s]
    q_dot: 1000000     # [W/m³]